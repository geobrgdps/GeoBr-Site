<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoBR — Admin</title><link rel="stylesheet" href="styles.css?v=9"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><strong>GeoBR</strong><span>Admin</span></a><a class="admin-back" href="index.html">← Voltar</a></div></header><main class="admin-page"><section class="admin-card" id="login-card"><div class="admin-kicker">PAINEL ADMINISTRATIVO</div><h1>GeoBR Admin</h1><p>Área restrita.</p><form id="login-form"><input id="admin-password" type="password" placeholder="Senha" autocomplete="current-password"><button>Entrar</button><small id="login-error" hidden>Senha incorreta.</small></form></section><section class="admin-card" id="panel" hidden><div class="admin-kicker">PAINEL ADMINISTRATIVO</div><h1>Configurar Levels</h1><p>As alterações são salvas no servidor e ficam disponíveis para todos.</p><div id="editor"></div><div class="admin-actions"><button id="save">Salvar no servidor</button><button id="reset">Recarregar do servidor</button><button id="logout">Sair</button></div><small id="saved" hidden>Alterações salvas no servidor.</small></section></main><script src="levels.js?v=9"></script><script>const API='https://xhmsydvbmrizcbvhdjyq.supabase.co/functions/v1/geobr-admin';const PASSWORD='GeoBR-ADM-2026';const login=document.querySelector('#login-card'),panel=document.querySelector('#panel'),form=document.querySelector('#login-form'),input=document.querySelector('#admin-password'),error=document.querySelector('#login-error'),editor=document.querySelector('#editor'),saved=document.querySelector('#saved');let levels=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function open(){login.hidden=true;panel.hidden=false;load()}async function call(action,levelsData){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password:PASSWORD,levels:levelsData})});const data=await r.json();if(!r.ok)throw Error(data.error||'Erro');return data}async function load(){try{const data=await call('load');levels=(data.levels||[]).map(l=>({id:l.id,position:l.position,name:l.name,creator:l.creator,level_id:l.level_id,verifier:l.verifier,video:l.showcase_url,difficulty:l.difficulty,status:l.status,thumbnail:l.thumbnail_url}));renderEditor()}catch(e){saved.textContent='Erro ao carregar servidor.';saved.hidden=false}}function renderEditor(){editor.innerHTML=levels.map((l,i)=>'<div class="level-edit"><div class="edit-title">#'+esc(l.position)+' · '+esc(l.name)+'</div><div class="edit-grid"><label>Posição<input data-i="'+i+'" data-k="position" type="number" value="'+esc(l.position)+'"></label><label>Nome<input data-i="'+i+'" data-k="name" value="'+esc(l.name)+'"></label><label>Criador<input data-i="'+i+'" data-k="creator" value="'+esc(l.creator)+'"></label><label>ID<input data-i="'+i+'" data-k="level_id" value="'+esc(l.level_id)+'"></label><label>Verificador<input data-i="'+i+'" data-k="verifier" value="'+esc(l.verifier)+'"></label><label>Showcase URL<input data-i="'+i+'" data-k="video" value="'+esc(l.video)+'" placeholder="https://youtube.com/watch?v=..."></label><label>Dificuldade<input data-i="'+i+'" data-k="difficulty" value="'+esc(l.difficulty)+'"></label><label>Status<input data-i="'+i+'" data-k="status" value="'+esc(l.status)+'"></label></div></div>').join('');editor.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{levels[+x.dataset.i][x.dataset.k]=x.value}))}form.addEventListener('submit',async e=>{e.preventDefault();if(input.value===PASSWORD){sessionStorage.setItem('geobr_admin','1');open()}else error.hidden=false});if(sessionStorage.getItem('geobr_admin')==='1')open();document.querySelector('#save').onclick=async()=>{try{await call('save',levels);saved.textContent='Alterações salvas no servidor.';saved.hidden=false;setTimeout(()=>saved.hidden=true,2200)}catch(e){saved.textContent='Erro ao salvar: '+e.message;saved.hidden=false}};document.querySelector('#reset').onclick=load;document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('geobr_admin');location.reload()};</script></body></html>
