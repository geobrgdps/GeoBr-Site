<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoBR — Admin</title><link rel="stylesheet" href="styles.css?v=8"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><strong>GeoBR</strong><span>Admin</span></a><a class="admin-back" href="index.html">← Voltar</a></div></header><main class="admin-page"><section class="admin-card" id="login-card"><div class="admin-kicker">PAINEL ADMINISTRATIVO</div><h1>GeoBR Admin</h1><p>Área restrita.</p><form id="login-form"><input id="admin-password" type="password" placeholder="Senha" autocomplete="current-password"><button>Entrar</button><small id="login-error" hidden>Senha incorreta.</small></form></section><section class="admin-card" id="panel" hidden><div class="admin-kicker">PAINEL ADMINISTRATIVO</div><h1>Configurar Levels</h1><p>Edite os dados dos levels. As alterações ficam salvas neste navegador.</p><div id="editor"></div><div class="admin-actions"><button id="save">Salvar alterações</button><button id="reset">Restaurar lista original</button><button id="logout">Sair</button></div><small id="saved" hidden>Alterações salvas.</small></section></main><script src="levels.js?v=8"></script><script>const PASSWORD='GeoBR-ADM-2026';const login=document.querySelector('#login-card'),panel=document.querySelector('#panel'),form=document.querySelector('#login-form'),input=document.querySelector('#admin-password'),error=document.querySelector('#login-error'),editor=document.querySelector('#editor'),saved=document.querySelector('#saved');let levels=[];function open(){login.hidden=true;panel.hidden=false;load()}function load(){try{levels=JSON.parse(localStorage.getItem('geobr_levels')||'null')||JSON.parse(JSON.stringify(window.LEVELS||[]))}catch(e){levels=JSON.parse(JSON.stringify(window.LEVELS||[]))}renderEditor()}function renderEditor(){editor.innerHTML=levels.map((l,i)=>'<div class="level-edit"><div class="edit-title">#'+(i+1)+' · '+escapeHtml(l.name)+'</div><div class="edit-grid"><label>Posição<input data-i="'+i+'" data-k="position" type="number" value="'+escapeAttr(l.position)+'"></label><label>Nome<input data-i="'+i+'" data-k="name" value="'+escapeAttr(l.name)+'"></label><label>Criador<input data-i="'+i+'" data-k="creator" value="'+escapeAttr(l.creator)+'"></label><label>ID<input data-i="'+i+'" data-k="id" value="'+escapeAttr(l.id)+'"></label><label>Verificador<input data-i="'+i+'" data-k="verifier" value="'+escapeAttr(l.verifier)+'"></label><label>Showcase URL<input data-i="'+i+'" data-k="video" value="'+escapeAttr(l.video)+'" placeholder="https://youtube.com/watch?v=..."></label><label>Dificuldade<input data-i="'+i+'" data-k="difficulty" value="'+escapeAttr(l.difficulty)+'"></label><label>Status<input data-i="'+i+'" data-k="status" value="'+escapeAttr(l.status)+'"></label></div></div>').join('');editor.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{levels[+x.dataset.i][x.dataset.k]=x.value}))}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function escapeAttr(v){return escapeHtml(v)}form.addEventListener('submit',e=>{e.preventDefault();if(input.value===PASSWORD){sessionStorage.setItem('geobr_admin','1');open()}else error.hidden=false});if(sessionStorage.getItem('geobr_admin')==='1')open();document.querySelector('#save').onclick=()=>{levels.sort((a,b)=>(+a.position||999999)-(+b.position||999999));localStorage.setItem('geobr_levels',JSON.stringify(levels));saved.hidden=false;setTimeout(()=>saved.hidden=true,1800);renderEditor()};document.querySelector('#reset').onclick=()=>{if(confirm('Restaurar os 32 levels originais?')){localStorage.removeItem('geobr_levels');load()}};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('geobr_admin');location.reload()};</script></body></html>
