<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar Recorde — GeoBR</title><link rel="stylesheet" href="styles.css?v=13"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><strong>GeoBR</strong><span>Demon List</span></a><a class="admin-back" href="index.html">← Voltar</a></div></header>
<main class="admin-page"><section class="admin-card"><div class="admin-kicker">GEOBR DEMON LIST</div><h1>Enviar recorde</h1><p>Envie os dados e o vídeo da sua gameplay. O recorde ficará pendente até a análise dos ADMs.</p>
<form id="record-form"><label>Seu nick<input id="player" maxlength="60" required></label><label>Level<select id="level" required><option value="">Carregando...</option></select></label><label>Progresso (%)<input id="progress" type="number" min="1" max="100" value="100" required></label><label>Observações<textarea id="notes" maxlength="500"></textarea></label><label>Vídeo (máximo 50 MB)<input id="video" type="file" accept="video/*" required></label><button id="send">Enviar recorde</button><p id="result" role="status"></p></form></section></main>
<script src="levels.js?v=13"></script><script>
const URL="https://xhmsydvbmrizcbvhdjyq.supabase.co",KEY="sb_publishable_ZZTfBI94AtOC6RsGNuMXYA_FemjbVk9",form=document.querySelector("#record-form"),level=document.querySelector("#level");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){let rows=[];try{const r=await fetch(URL+"/rest/v1/levels?select=id,name,position&order=position.asc",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(r.ok)rows=await r.json()}catch(e){}if(!rows.length&&Array.isArray(window.LEVELS))rows=window.LEVELS;level.innerHTML='<option value="">Selecione o level</option>'+rows.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join("")}
form.onsubmit=async e=>{e.preventDefault();const f=document.querySelector("#video").files[0],btn=document.querySelector("#send"),msg=document.querySelector("#result");if(!f||f.size>52428800){msg.textContent="Escolha um vídeo de até 50 MB.";return}btn.disabled=true;msg.textContent="Enviando vídeo...";try{const ext=(f.name.split(".").pop()||"mp4").replace(/[^a-z0-9]/gi,"").toLowerCase(),path="pending/"+crypto.randomUUID()+"."+ext;let r=await fetch(URL+"/storage/v1/object/record-videos/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":f.type||"video/mp4"},body:f});if(!r.ok)throw Error("Falha no upload do vídeo: "+r.status);const nick=document.querySelector("#player").value.trim();r=await fetch(URL+"/rest/v1/submissions",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({player_name:nick,submitter:nick,level_name:level.value,progress:Number(document.querySelector("#progress").value),notes:document.querySelector("#notes").value.trim(),video_path:path,status:"Pending"})});if(!r.ok)throw Error("Falha ao registrar o recorde: "+r.status);form.reset();msg.textContent="Recorde enviado! Aguarde a análise dos ADMs."}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};init();
</script></body></html>
